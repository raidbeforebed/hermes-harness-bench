<text x="28" y="58" fill="#7d8590" font-size="12">Mean tokens per task, over runs that reported usage. A timed-out run is killed before usage is emitted, so it is unknown rather than zero. These are each endpoint's own</text>
<text x="28" y="74" fill="#7d8590" font-size="12">accounting: two llama-server models on the same build report 711 and 10,710 prompt tokens a turn, so compare within an endpoint, not across providers.</text>
